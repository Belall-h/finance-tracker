<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Finance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0e;--surface:#161616;--surface2:#1e1e1e;
  --border:rgba(255,255,255,0.08);--text:#f0ede8;--muted:#666;
  --accent:#c8f56a;--accent-dim:rgba(200,245,106,0.12);
  --danger:#ff6b6b;--danger-dim:rgba(255,107,107,0.12);
  --amber:#ffb347;--amber-dim:rgba(255,179,71,0.12);
  --blue:#5eb8ff;--blue-dim:rgba(94,184,255,0.1);
  --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{display:flex;flex-direction:column;max-width:480px;margin:auto;}

.hdr{padding:1rem 1rem .75rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;}
.hdr h1{font-size:20px;font-weight:700;color:var(--accent);letter-spacing:-0.02em;}
.hdr-sub{font-size:10px;font-family:var(--mono);color:var(--muted);margin-top:3px;}
.sync-status{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:5px;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.sync-status.synced{background:var(--accent-dim);color:var(--accent);}
.sync-status.syncing{background:var(--amber-dim);color:var(--amber);}
.sync-status.error{background:var(--danger-dim);color:var(--danger);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.sync-dot.pulse{animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.tab{flex:1;padding:.65rem .25rem;font-size:11px;font-family:var(--mono);color:var(--muted);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:0.03em;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.content{flex:1;overflow-y:auto;padding:.9rem .85rem 5rem;}
.page{display:none;}.page.active{display:block;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;margin-bottom:8px;}
.section-label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6rem;}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.row-label{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

input[type=number],input[type=text]{
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 9px;
  outline:none;-moz-appearance:textfield;width:100%;
}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
input:focus{border-color:var(--accent);}
.input-sm{width:85px!important;}
.input-xs{width:65px!important;}

.btn{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:12px;padding:8px 12px;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;}
.btn.primary{background:var(--accent);color:#0e0e0e;border-color:var(--accent);font-weight:500;}
.btn.danger-hover:active{color:var(--danger);border-color:var(--danger);}
.btn.wide{width:100%;margin-top:8px;}
.btn:active{transform:scale(.96);}
.btn-icon{background:transparent;border:none;color:var(--muted);font-size:14px;padding:4px 6px;cursor:pointer;border-radius:5px;}
.btn-icon:active{color:var(--danger);}

.total-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.total-lbl{font-size:11px;font-family:var(--mono);color:var(--muted);}
.total-val{font-size:19px;font-weight:700;font-family:var(--mono);}
.total-val.exp{color:var(--danger);}.total-val.debt{color:var(--amber);}

.track{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin-top:7px;}
.fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1);}
.fill-red{background:var(--danger);}.fill-amber{background:var(--amber);}.fill-green{background:var(--accent);}.fill-blue{background:var(--blue);}
.plabels{display:flex;justify-content:space-between;font-size:9px;font-family:var(--mono);color:var(--muted);margin-top:3px;}

.debt-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;margin-bottom:8px;}
.debt-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.debt-name{font-size:14px;font-weight:500;}
.debt-meta{font-size:10px;font-family:var(--mono);color:var(--muted);margin-top:2px;}
.debt-bal{font-size:16px;font-weight:700;font-family:var(--mono);color:var(--amber);white-space:nowrap;}
.min-tag{display:inline-block;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:5px;background:var(--blue-dim);color:var(--blue);margin-top:3px;}
.min-tag.free{background:var(--accent-dim);color:var(--accent);}
.rate-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.rate-badge{font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:6px;background:var(--danger-dim);color:var(--danger);}
.pay-row{display:flex;gap:8px;margin-top:8px;}

.add-form{background:var(--surface2);border:1px dashed var(--border);border-radius:10px;padding:.8rem;margin-top:8px;display:none;}
.add-form.open{display:block;}
.add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.add-row input[type=text]{flex:1;min-width:100px;}

.log-entry{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);gap:8px;}
.log-entry:last-child{border-bottom:none;}
.log-name{font-size:12px;font-family:var(--mono);font-weight:500;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.log-date{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px;}
.log-amt{font-size:13px;font-family:var(--mono);font-weight:500;color:var(--accent);white-space:nowrap;}
.tag{font-size:9px;font-family:var(--mono);padding:1px 5px;border-radius:3px;}
.tag.sav{background:var(--accent-dim);color:var(--accent);}
.tag.dbt{background:var(--blue-dim);color:var(--blue);}
.tag.add{background:var(--danger-dim);color:var(--danger);}

.sav-big{font-size:28px;font-weight:700;font-family:var(--mono);color:var(--accent);}
.sav-sub{font-size:11px;font-family:var(--mono);color:var(--muted);margin-top:2px;}
.sav-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;}
.sav-btns{display:flex;gap:8px;margin-top:10px;}

.empty{font-size:12px;font-family:var(--mono);color:var(--muted);text-align:center;padding:1rem 0;}
.divider{border:none;border-top:1px solid var(--border);margin:1rem 0;}

.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px;transition:opacity .3s;}
.loading-overlay.hidden{opacity:0;pointer-events:none;}
.loading-spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:12px;font-family:var(--mono);color:var(--muted);}
</style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">Connecting to database...</div>
</div>

<div class="hdr">
  <div class="hdr-top">
    <div>
      <h1>Finance Tracker</h1>
      <div class="hdr-sub" id="hdate"></div>
    </div>
    <div class="sync-status synced" id="sync-status">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="sync-label">synced</span>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('expenses',this)">Expenses</button>
  <button class="tab" onclick="switchTab('debt',this)">Debt</button>
  <button class="tab" onclick="switchTab('history',this)">History</button>
  <button class="tab" onclick="switchTab('savings',this)">Savings</button>
</div>

<div class="content">

  <div class="page active" id="page-expenses">
    <div class="section-label" style="margin-top:.5rem;">Monthly Expenses</div>
    <div id="exp-list"></div>
    <div class="add-form" id="add-form">
      <div class="add-row">
        <input type="text" id="new-name" placeholder="Expense name" />
        <input type="number" id="new-amt" placeholder="$" min="0" step="0.01" style="width:75px;" />
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn primary" style="flex:1;" onclick="addExpense()">Add</button>
        <button class="btn danger-hover" style="flex:1;" onclick="toggleAdd()">Cancel</button>
      </div>
    </div>
    <button class="btn wide" onclick="toggleAdd()">+ Add expense</button>
    <div class="divider"></div>
    <div class="total-box">
      <div class="total-lbl">total monthly</div>
      <div class="total-val exp" id="exp-total">$0.00</div>
    </div>
  </div>

  <div class="page" id="page-debt">
    <div class="section-label" style="margin-top:.5rem;">Debt Overview</div>
    <div class="total-box">
      <div style="flex:1;">
        <div class="total-lbl">total remaining</div>
        <div class="track" style="max-width:160px;"><div class="fill fill-amber" id="total-debt-bar" style="width:100%;"></div></div>
        <div class="plabels" style="max-width:160px;"><span>$0</span><span id="total-debt-max"></span></div>
      </div>
      <div class="total-val debt" id="total-debt-val"></div>
    </div>
    <div id="debt-list"></div>
    <div class="add-form" id="add-debt-form">
      <div style="font-size:10px;font-family:var(--mono);color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;">New loan</div>
      <input type="text" id="nd-name" placeholder="Loan name (e.g. Car loan)" style="margin-bottom:8px;" />
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="number" id="nd-balance" placeholder="Balance $" min="0" step="1" style="flex:1;" />
        <input type="number" id="nd-rate" placeholder="Rate %" min="0" step="0.01" style="flex:1;" />
      </div>
      <input type="number" id="nd-minpay" placeholder="Min payment $/mo" min="0" step="1" style="margin-bottom:8px;" />
      <div style="display:flex;gap:8px;">
        <button class="btn primary" style="flex:1;" onclick="addDebt()">Add loan</button>
        <button class="btn danger-hover" style="flex:1;" onclick="toggleAddDebt()">Cancel</button>
      </div>
    </div>
    <button class="btn wide" onclick="toggleAddDebt()">+ Add new loan</button>
  </div>

  <div class="page" id="page-history">
    <div class="section-label" style="margin-top:.5rem;">Payment History</div>
    <div class="card" id="log-list"></div>
  </div>

  <div class="page" id="page-savings">
    <div class="section-label" style="margin-top:.5rem;">Savings</div>
    <div class="card">
      <div class="sav-top">
        <div>
          <div class="sav-big" id="sav-display">$0.00</div>
          <div class="sav-sub">of <span id="sav-goal-label">$10,000</span> goal</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:10px;font-family:var(--mono);color:var(--muted);margin-bottom:4px;">goal</div>
          <input type="number" id="goal-input" value="10000" min="100" step="100" style="width:85px;" oninput="updateGoal()" />
        </div>
      </div>
      <div class="track"><div class="fill fill-green" id="sav-bar" style="width:0%;"></div></div>
      <div class="plabels"><span>$0</span><span id="sav-bar-max">$10,000</span></div>
      <div style="margin-top:12px;">
        <input type="number" id="sav-input" placeholder="Enter amount" min="0" step="1" style="margin-bottom:8px;" />
        <div class="sav-btns">
          <button class="btn primary" style="flex:1;" onclick="addSavings()">+ Add</button>
          <button class="btn danger-hover" style="flex:1;" onclick="removeSavings()">- Remove</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ── SUPABASE CONFIG ──────────────────────────────────────────
const SUPABASE_URL = 'https://jlfqumbllmwrgjypzdxu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsZnF1bWJsbG13cmdqeXB6ZHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3ODY5OTAsImV4cCI6MjA5NjM2Mjk5MH0.6kbem3kPGX-gEpRkzxyaGJzGi-7usuA2PV0cSppWV4Y';
const ROW_ID = 'belall';
const API = `${SUPABASE_URL}/rest/v1/tracker`;

const HEADERS = {
  'Content-Type': 'application/json',
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Prefer': 'return=minimal'
};

// ── DEFAULTS ─────────────────────────────────────────────────
const DEFAULTS = {
  expenses:[
    {id:1,name:'Rent',amount:300},{id:2,name:'Internet',amount:70},
    {id:3,name:'Gas',amount:200},{id:4,name:'Gym',amount:100},
    {id:5,name:'Health insurance',amount:65},{id:6,name:'Caffeine',amount:150},
    {id:7,name:'Miscellaneous',amount:200}
  ],
  debts:[
    {id:'cc',name:'Credit card',original:4724,balance:4724,rate:22.99,rateFixed:true,rateLabel:'Annual — ~$1.38/day',isDefault:true},
    {id:'ab',name:'Alberta student loans',original:13251,balance:13251,rate:4.45,rateFixed:false,minPayment:170,rateLabel:'Floating rate',isDefault:true},
    {id:'ca',name:'Canada student loans',original:6222,balance:6222,rate:0,rateFixed:false,minPayment:0,rateLabel:'No interest',isDefault:true}
  ],
  savings:0,
  savingsGoal:10000,
  paymentLog:[],
  nextId:200
};

let S = JSON.parse(JSON.stringify(DEFAULTS));
let saveTimer = null;
let isSaving = false;

// ── SYNC STATUS ───────────────────────────────────────────────
function setSyncStatus(state) {
  const el = document.getElementById('sync-status');
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  el.className = 'sync-status ' + state;
  dot.className = 'sync-dot' + (state === 'syncing' ? ' pulse' : '');
  lbl.textContent = state === 'syncing' ? 'saving...' : state === 'error' ? 'offline' : 'synced';
}

// ── SUPABASE LOAD ─────────────────────────────────────────────
async function dbLoad() {
  const res = await fetch(`${API}?id=eq.${ROW_ID}&select=data`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error('Load failed: ' + res.status);
  const rows = await res.json();
  if (rows.length && rows[0].data && Object.keys(rows[0].data).length > 0) {
    S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), rows[0].data);
  }
  // If empty row exists but no data, keep defaults (fresh start)
}

// ── SUPABASE SAVE ─────────────────────────────────────────────
async function dbSave() {
  if (isSaving) return;
  isSaving = true;
  setSyncStatus('syncing');
  try {
    const res = await fetch(`${API}?id=eq.${ROW_ID}`, {
      method: 'PATCH',
      headers: HEADERS,
      body: JSON.stringify({ data: S, updated_at: new Date().toISOString() })
    });
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    setSyncStatus('synced');
  } catch(e) {
    setSyncStatus('error');
    console.error('Save error:', e);
  } finally {
    isSaving = false;
  }
}

function save() {
  clearTimeout(saveTimer);
  setSyncStatus('syncing');
  saveTimer = setTimeout(() => dbSave(), 800);
}

// ── INIT ──────────────────────────────────────────────────────
async function init() {
  document.getElementById('loading-text').textContent = 'Loading your data...';
  try {
    await dbLoad();
  } catch(e) {
    console.error('DB load error:', e);
    setSyncStatus('error');
  }
  document.getElementById('loading-overlay').classList.add('hidden');
  render();
  setSyncStatus('synced');
}

// ── HELPERS ───────────────────────────────────────────────────
function fmt(n){ return '$'+Math.abs(n).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtS(n){ return '$'+Math.round(Math.abs(n)).toLocaleString('en-CA'); }
function calcCCMin(b){ return b<=0?0:Math.max(10,parseFloat((b*0.02).toFixed(2))); }
function calcFloatMin(d){
  if(d.balance<=0) return 0;
  if(!d.rate||d.rate===0) return 0;
  const mo=d.balance*(d.rate/100/12);
  const pr=d.balance*0.01;
  return Math.max(10,parseFloat((mo+pr).toFixed(2)));
}
function getMin(d){
  if(d.id==='cc') return calcCCMin(d.balance);
  if(!d.rateFixed && d.rate>0) return calcFloatMin(d);
  return d.minPayment||0;
}
function todayStr(){ return new Date().toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'}); }

function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
}

function render(){ renderExpenses(); renderDebts(); renderLog(); renderSavings(); }

// ── RENDER ────────────────────────────────────────────────────
function renderExpenses(){
  const list=document.getElementById('exp-list');
  if(!S.expenses.length){ list.innerHTML='<div class="empty">No expenses yet</div>'; }
  else {
    list.innerHTML=S.expenses.map(e=>`
      <div class="card">
        <div class="row">
          <div class="row-label">${e.name}</div>
          <div style="display:flex;align-items:center;gap:7px;flex-shrink:0;">
            <span style="font-size:11px;font-family:var(--mono);color:var(--muted);">$</span>
            <input type="number" value="${e.amount}" min="0" step="0.01" class="input-sm"
              oninput="updateExp(${e.id},this.value)" />
            <button class="btn-icon" onclick="removeExp(${e.id})">✕</button>
          </div>
        </div>
      </div>`).join('');
  }
  const total=S.expenses.reduce((s,e)=>s+parseFloat(e.amount||0),0);
  document.getElementById('exp-total').textContent=fmt(total);
}

function renderDebts(){
  const total=S.debts.reduce((s,d)=>s+d.balance,0);
  const totalOrig=S.debts.reduce((s,d)=>s+d.original,0);
  const pct=totalOrig>0?Math.max(0,Math.min(100,(total/totalOrig)*100)):0;
  document.getElementById('total-debt-val').textContent=fmt(total);
  document.getElementById('total-debt-bar').style.width=pct+'%';
  document.getElementById('total-debt-max').textContent=fmtS(totalOrig);
  const fillMap={cc:'fill-red',ab:'fill-amber',ca:'fill-blue'};
  document.getElementById('debt-list').innerHTML=S.debts.map(d=>{
    const dpct=Math.max(0,Math.min(100,(d.balance/d.original)*100));
    const minPay=getMin(d);
    const minLabel=d.id==='cc'
      ?`min ${fmt(minPay)}/mo (2% of balance)`
      :(!d.rateFixed&&d.rate>0)?`min ${fmt(minPay)}/mo (rate-based)`
      :minPay>0?`min ${fmt(minPay)}/mo`:'no min payment';
    return `
      <div class="debt-card">
        <div class="debt-top">
          <div style="flex:1;min-width:0;">
            <div class="debt-name">${d.name}</div>
            <div class="debt-meta">${d.rateLabel}</div>
            <span class="min-tag${minPay===0?' free':''}">${minLabel}</span>
          </div>
          <div class="debt-bal" style="margin-left:8px;">${fmt(d.balance)}</div>
        </div>
        <div class="rate-row">
          <span style="font-size:10px;font-family:var(--mono);color:var(--muted);">Rate:</span>
          ${d.rateFixed
            ?`<span class="rate-badge">${d.rate}% fixed</span>`
            :`<input type="number" value="${d.rate}" min="0" step="0.01" class="input-xs"
                oninput="updateRate('${d.id}',this.value)" />
              <span style="font-size:10px;font-family:var(--mono);color:var(--muted);">% floating</span>`}
        </div>
        <div class="track"><div class="fill ${fillMap[d.id]||'fill-blue'}" style="width:${dpct}%;"></div></div>
        <div class="plabels"><span>${fmt(d.balance)} left</span><span>of ${fmtS(d.original)}</span></div>
        <div class="pay-row">
          <input type="number" id="pay-${d.id}" placeholder="Pay amount" min="0" step="1" style="flex:1;" />
          <button class="btn primary" onclick="makePayment('${d.id}')">Pay ↓</button>
          <button class="btn" onclick="addToDebt('${d.id}')" title="Add to balance" style="padding:8px 10px;">＋</button>
        </div>
        ${!d.isDefault?`<button class="btn danger-hover" style="width:100%;margin-top:6px;font-size:11px;" onclick="removeDebt('${d.id}')">Remove loan</button>`:''}
      </div>`;
  }).join('');
}

function renderLog(){
  const el=document.getElementById('log-list');
  if(!S.paymentLog.length){ el.innerHTML='<div class="empty">No entries yet</div>'; return; }
  const debtPaid=S.paymentLog.filter(e=>e.type!=='savings'&&!e.isAddition).reduce((s,e)=>s+e.amount,0);
  const debtAdded=S.paymentLog.filter(e=>e.isAddition).reduce((s,e)=>s+e.amount,0);
  const savTotal=S.paymentLog.filter(e=>e.type==='savings').reduce((s,e)=>s+e.amount,0);
  const colorMap={cc:'#ff6b6b',ab:'#ffb347',ca:'#5eb8ff'};
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;gap:6px;">
      <div style="flex:1;background:var(--surface2);border-radius:8px;padding:7px 9px;">
        <div style="font-size:9px;font-family:var(--mono);color:var(--muted);margin-bottom:2px;">DEBT PAID</div>
        <div style="font-size:13px;font-weight:700;font-family:var(--mono);color:var(--blue);">${fmt(debtPaid)}</div>
      </div>
      <div style="flex:1;background:var(--surface2);border-radius:8px;padding:7px 9px;">
        <div style="font-size:9px;font-family:var(--mono);color:var(--muted);margin-bottom:2px;">DEBT ADDED</div>
        <div style="font-size:13px;font-weight:700;font-family:var(--mono);color:var(--danger);">${fmt(debtAdded)}</div>
      </div>
      <div style="flex:1;background:var(--surface2);border-radius:8px;padding:7px 9px;">
        <div style="font-size:9px;font-family:var(--mono);color:var(--muted);margin-bottom:2px;">SAVED</div>
        <div style="font-size:13px;font-weight:700;font-family:var(--mono);color:var(--accent);">${fmt(savTotal)}</div>
      </div>
    </div>
    ${S.paymentLog.map(e=>{
      const isSav=e.type==='savings';
      const color=isSav?'#c8f56a':(colorMap[e.debtId]||'#c8f56a');
      return `
        <div class="log-entry">
          <div style="flex:1;min-width:0;">
            <div class="log-name" style="color:${color};">
              ${e.debtName}<span class="tag ${isSav?'sav':e.isAddition?'add':'dbt'}">${isSav?'SAV':e.isAddition?'ADDED':'PAID'}</span>
            </div>
            <div class="log-date">${e.date}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <span class="log-amt">${fmt(e.amount)}</span>
            <button class="btn-icon" onclick="removeLog(${e.id})">✕</button>
          </div>
        </div>`;
    }).join('')}`;
}

function renderSavings(){
  const pct=Math.max(0,Math.min(100,(S.savings/S.savingsGoal)*100));
  document.getElementById('sav-display').textContent=fmt(S.savings);
  document.getElementById('sav-bar').style.width=pct+'%';
  document.getElementById('sav-goal-label').textContent=fmtS(S.savingsGoal);
  document.getElementById('sav-bar-max').textContent=fmtS(S.savingsGoal);
  document.getElementById('goal-input').value=S.savingsGoal;
}

// ── ACTIONS ───────────────────────────────────────────────────
function updateExp(id,val){
  const e=S.expenses.find(x=>x.id===id);
  if(e){e.amount=parseFloat(val)||0;save();renderExpenses();}
}
function removeExp(id){
  S.expenses=S.expenses.filter(x=>x.id!==id);save();renderExpenses();
}
function toggleAdd(){
  const f=document.getElementById('add-form');
  f.classList.toggle('open');
  if(f.classList.contains('open')) document.getElementById('new-name').focus();
}
function addExpense(){
  const name=document.getElementById('new-name').value.trim();
  const amount=parseFloat(document.getElementById('new-amt').value)||0;
  if(!name) return;
  S.expenses.push({id:S.nextId++,name,amount});
  document.getElementById('new-name').value='';
  document.getElementById('new-amt').value='';
  document.getElementById('add-form').classList.remove('open');
  save();renderExpenses();
}
function updateRate(id,val){
  const d=S.debts.find(x=>x.id===id);
  if(d){d.rate=parseFloat(val)||0;save();}
}
function makePayment(id){
  const d=S.debts.find(x=>x.id===id);
  const input=document.getElementById('pay-'+id);
  const amount=parseFloat(input.value)||0;
  if(!d||amount<=0) return;
  const actual=Math.min(amount,d.balance);
  d.balance=parseFloat(Math.max(0,d.balance-actual).toFixed(2));
  input.value='';
  S.paymentLog.unshift({id:S.nextId++,debtId:id,debtName:d.name,amount:actual,date:todayStr(),timestamp:Date.now()});
  save();renderDebts();renderLog();
}
function removeLog(logId){
  const entry=S.paymentLog.find(x=>x.id===logId);
  if(!entry) return;
  if(entry.type==='savings'){
    S.savings=parseFloat(Math.max(0,S.savings-entry.amount).toFixed(2));
  } else {
    const d=S.debts.find(x=>x.id===entry.debtId);
    if(d) d.balance=parseFloat(Math.min(d.original,d.balance+entry.amount).toFixed(2));
  }
  S.paymentLog=S.paymentLog.filter(x=>x.id!==logId);
  save();renderDebts();renderLog();renderSavings();
}
function addSavings(){
  const val=parseFloat(document.getElementById('sav-input').value)||0;
  if(val<=0) return;
  S.savings=parseFloat(Math.min(S.savingsGoal,S.savings+val).toFixed(2));
  document.getElementById('sav-input').value='';
  S.paymentLog.unshift({id:S.nextId++,type:'savings',debtName:'Savings',amount:val,date:todayStr(),timestamp:Date.now()});
  save();renderSavings();renderLog();
}
function removeSavings(){
  const val=parseFloat(document.getElementById('sav-input').value)||0;
  if(val<=0) return;
  S.savings=parseFloat(Math.max(0,S.savings-val).toFixed(2));
  document.getElementById('sav-input').value='';
  save();renderSavings();
}
function updateGoal(){
  S.savingsGoal=parseFloat(document.getElementById('goal-input').value)||10000;
  save();renderSavings();
}
function toggleAddDebt(){
  const f=document.getElementById('add-debt-form');
  f.classList.toggle('open');
  if(f.classList.contains('open')) document.getElementById('nd-name').focus();
}
function addDebt(){
  const name=document.getElementById('nd-name').value.trim();
  const balance=parseFloat(document.getElementById('nd-balance').value)||0;
  const rate=parseFloat(document.getElementById('nd-rate').value)||0;
  const minPayment=parseFloat(document.getElementById('nd-minpay').value)||0;
  if(!name||balance<=0) return;
  const id='loan-'+S.nextId++;
  S.debts.push({id,name,original:balance,balance,rate,rateFixed:false,minPayment,rateLabel:'Floating rate',isDefault:false});
  document.getElementById('nd-name').value='';
  document.getElementById('nd-balance').value='';
  document.getElementById('nd-rate').value='';
  document.getElementById('nd-minpay').value='';
  document.getElementById('add-debt-form').classList.remove('open');
  save();renderDebts();
}
function addToDebt(id){
  const d=S.debts.find(x=>x.id===id);
  const input=document.getElementById('pay-'+id);
  const amount=parseFloat(input.value)||0;
  if(!d||amount<=0) return;
  d.balance=parseFloat((d.balance+amount).toFixed(2));
  d.original=Math.max(d.original,d.balance);
  input.value='';
  S.paymentLog.unshift({id:S.nextId++,debtId:id,debtName:d.name+' (added)',amount,date:todayStr(),timestamp:Date.now(),isAddition:true});
  save();renderDebts();renderLog();
}
function removeDebt(id){
  S.debts=S.debts.filter(x=>x.id!==id);
  save();renderDebts();
}

document.getElementById('hdate').textContent=
  new Date().toLocaleDateString('en-CA',{weekday:'long',year:'numeric',month:'short',day:'numeric'});
document.getElementById('new-amt').addEventListener('keydown',e=>{if(e.key==='Enter')addExpense();});

init();
</script>
</body>
</html>
